name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications/ | grep Xcode
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Go static library
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Install xcodegen and regenerate project
        run: |
          brew install xcodegen
          cd $GITHUB_WORKSPACE
          xcodegen generate
          # Re-apply HACKS.md patch: move libgolocationspoofer.a from the
          # Resources build phase to the Frameworks build phase.
          python3 << 'PYEOF'
          import re

          with open("location-spoofer.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()

          lines = content.split("\n")

          lib_ref_id = None
          lib_build_id = None
          for line in lines:
              if "libgolocationspoofer.a" in line and "PBXFileReference" not in line and "PBXBuildFile" in line:
                  lib_build_id = line.strip().split(" ")[0]
              if "libgolocationspoofer.a" in line and "PBXFileReference" in line:
                  lib_ref_id = line.strip().split(" ")[0]

          if lib_build_id:
              new_lines = []
              resources_section = False
              frameworks_section = False

              for i, line in enumerate(lines):
                  if "/* Resources */" in line and "PBXResourcesBuildPhase" in line:
                      resources_section = True
                  if "/* Frameworks */" in line and "PBXFrameworksBuildPhase" in line:
                      frameworks_section = True

                  if resources_section and lib_build_id in line:
                      resources_section = False
                      continue

                  if frameworks_section and "files = (" in line:
                      new_lines.append(line)
                      if lib_build_id not in content.split("/* Frameworks */")[1].split("/* End")[0] if "/* Frameworks */" in content else "":
                          new_lines.append(f"\t\t\t\t{lib_build_id} /* libgolocationspoofer.a in Frameworks */,")
                      frameworks_section = False
                      continue

                  new_lines.append(line)

              with open("location-spoofer.xcodeproj/project.pbxproj", "w") as f:
                  f.write("\n".join(new_lines))
              print("HACKS.md patch applied")
          else:
              print("WARNING: libgolocationspoofer.a build ref not found, skipping patch")
          PYEOF

      - name: Build archive (no signing)
        run: |
          xcodebuild archive \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -archivePath $RUNNER_TEMP/LocationSpoofer.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER

      - name: Package unsigned IPA
        run: |
          cd $RUNNER_TEMP/LocationSpoofer.xcarchive/Products/Applications
          mkdir -p $RUNNER_TEMP/Payload
          cp -R *.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r $RUNNER_TEMP/LocationSpoofer-unsigned.ipa Payload

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Tool-IPA
          path: ${{ runner.temp }}/LocationSpoofer-unsigned.ipa
          retention-days: 30
